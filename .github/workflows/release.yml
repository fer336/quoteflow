name: Production Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/fer336/octopus-flow

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate version
        id: version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: expected vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish-images:
    name: Publish ${{ matrix.name }} image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: ./backend
            image: backend
            app_mode: backend
          - name: frontend
            context: ./frontend
            image: frontend
            app_mode: tenant
          - name: frontend-cms
            context: ./frontend
            image: frontend-cms
            app_mode: cms
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Protect immutable release tag
        id: existing-image
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docker pull --quiet "$IMAGE" >/dev/null
          published_sha="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")"
          if [[ "$published_sha" != "$RELEASE_SHA" ]]; then
            echo "Release tag already exists for a different or unknown commit; refusing to overwrite it." >&2
            exit 1
          fi
          echo "Release image already exists for commit $RELEASE_SHA; skipping rebuild."
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        if: matrix.name == 'backend' && steps.existing-image.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ needs.validate.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/fer336/octopus-flow
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}

      - name: Build and push frontend image
        if: matrix.name != 'backend' && steps.existing-image.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ needs.validate.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/fer336/octopus-flow
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
          build-args: |
            VITE_API_URL=${{ secrets.FRONTEND_VITE_API_URL || 'https://login-flow.octopustrack.shop/api' }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.FRONTEND_VITE_GOOGLE_CLIENT_ID || '1016270254180-5odhc9o98c2sqgpvpipku9urjthlrdob.apps.googleusercontent.com' }}
            VITE_ADMIN_API_URL=${{ secrets.FRONTEND_VITE_ADMIN_API_URL || 'https://login-flow.octopustrack.shop/api/admin' }}
            VITE_APP_MODE=${{ matrix.app_mode }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}

  deploy-production:
    name: Deploy production
    needs:
      - validate
      - publish-images
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger Portainer Git stack deployment
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$PORTAINER_WEBHOOK_URL" ]]; then
            echo "PORTAINER_WEBHOOK_URL is not configured" >&2
            exit 1
          fi
          echo "Deploying $VERSION from commit $RELEASE_SHA"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --get \
            --data-urlencode "OCTOPUSFLOW_VERSION=$VERSION" \
            "$PORTAINER_WEBHOOK_URL"

  create-release:
    name: Create GitHub Release
    needs:
      - validate
      - deploy-production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
